<div class="shell">
  <mat-toolbar class="topbar">
    <span class="title">{{ title() }}</span>
    <span class="subtitle">Describe a UI — the agent builds it live.</span>
  </mat-toolbar>

  <main class="panes">
    <section class="pane chat-pane" aria-label="Chat">
      <copilot-chat agentId="uiAgent" />
    </section>

    <section class="pane ui-pane" aria-label="Generated UI">
      <app-surface-pane />
    </section>
  </main>
</div>
