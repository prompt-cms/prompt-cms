<div class="shell">
  <mat-toolbar class="topbar">
    <span class="title">{{ title() }}</span>
    <span class="subtitle">Describe a UI — the agent builds it live.</span>
  </mat-toolbar>

  <main class="panes">
    <section class="pane chat-pane" aria-label="Chat">
      <copilot-chat agentId="uiAgent" />
    </section>

    <section class="pane ui-pane" aria-label="Generated UI">
      <div class="ui-placeholder">
        <p>Generated UI will appear here.</p>
        <p class="hint">
          A2UI surfaces stream in as the agent calls
          <code>generate_ui</code>.
        </p>
      </div>
    </section>
  </main>
</div>
